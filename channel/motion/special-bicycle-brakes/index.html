<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- special-bicycle-brakes (Everyday Things Explained). 1080x1920, 60.17 s. 3D build in assets/world.js (parts from assets/beats.js),
         HUD, captions and the end card are scene files in compositions/. Generated by scripts/build_timeline.py. -->
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js", "three/addons/": "./assets/vendor/jsm/" } }
    </script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise(function (res) { window.__worldReady = res; });
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071226; }
      #root { position: relative; width: 100%; height: 100%; background: #071226; }
      #world-wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #world { display: block; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60.17" data-width="1080" data-height="1920">
      <div id="world-wrap" class="clip" data-start="0" data-duration="60.17" data-track-index="0" data-layout-ignore>
        <canvas id="world" width="1080" height="1920"></canvas>
      </div>

      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
        data-start="0" data-duration="60.17" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="0" data-duration="60.17" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="60.17" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="vo" class="clip" src="assets/audio/vo.mp3" data-start="0" data-duration="59.559" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="60.17" data-track-index="5" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="assets/world.js"></script>
  </body>
</html>
